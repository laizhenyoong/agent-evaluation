name: evals

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Scorers and gate logic are pure functions over trace files, so they run on
  # a hosted runner with no model in sight.
  offline:
    name: scorer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  # Capturing trajectories needs the local Ollama model, which a hosted runner
  # does not have. This job re-scores the committed traces and fails the PR if
  # any gated rate falls below results/baseline-summary.json.
  gate:
    name: regression gate
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Gate captured traces against the committed baseline
        run: |
          if [ ! -f results/baseline.jsonl ]; then
            echo "No committed traces yet; run 'make baseline' locally and commit them."
            exit 0
          fi
          python -m evaluation.report \
            --traces results/baseline.jsonl \
            --baseline results/baseline-summary.json \
            --tolerance 0.02
